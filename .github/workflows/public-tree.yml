name: Public tree
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: No game content, derived output or machine-specific paths
        run: python tools/check_public_tree.py
      - name: Synthetic Python tests
        run: python -m unittest tests.test_check_public_tree tests.test_profile_pins tests.test_sdk_pins

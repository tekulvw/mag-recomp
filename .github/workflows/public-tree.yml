name: Public tree
# Pull requests cover PR branches; push runs only for main, so a PR branch is not checked twice.
on:
  push:
    branches: [main]
  pull_request:
# Runs for every change (a required check). Cancel a pull request's superseded runs; every push
# keeps its own group.
concurrency:
  group: public-tree-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: mag-recomp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: No game content, derived output or machine-specific paths
        run: python tools/check_public_tree.py
      - name: Synthetic Python tests
        run: python -m unittest tests.test_check_public_tree

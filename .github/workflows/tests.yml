name: Tests
on:
  push:
    branches: [main, codex/render-frontend-integration]
  pull_request:
permissions:
  contents: read
# Cancel a pull request's superseded runs; every push keeps its own group.
concurrency:
  group: tests-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  # `python` is a required check, so this workflow always runs; the Rust input
  # matrix skips itself when only docs or Markdown changed.
  changes:
    runs-on: mag-recomp
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if files=$(git diff --name-only "$BASE" HEAD 2>/dev/null) && [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^docs/|\.md$'; then
            echo code=false >> "$GITHUB_OUTPUT"
          else
            echo code=true >> "$GITHUB_OUTPUT"
          fi
  rust:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Rust input (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Hosted macOS capacity is scarce: pull requests run Linux and Windows,
        # pushes to main add macOS.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["mag-recomp","windows-latest"]' || '["macos-latest","mag-recomp","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: crates/mag-input
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/self-hosted-linux
        with:
          rust: 'true'
      - name: Pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --offline --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --offline
  native-edgegeom:
    # The opt-in native Edge geometry job's synthetic tests on the other two hosts; the python
    # jobs run them on Linux and macOS with the rest of the suite.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Pinned ps3recomp runtime
        run: python tools/fetch_ps3recomp.py --role runtime
      - name: Native Edge geometry tests
        env:
          MAG_TEST_SDK: ${{ github.workspace }}/local/ps3recomp-runtime
        run: python -m unittest tests.test_native_edgegeom tests.test_payload_override_hooks tests.test_extension_registry -v
  python:
    # Required check. Runs on the self-hosted Linux runners so pull requests are gated without
    # hosted minutes; tests that need macOS skip themselves here and run in python-macos below.
    runs-on: mag-recomp
    env:
      MAG_TEST_SDK: ${{ github.workspace }}/local/ps3recomp-runtime
      SPU_BATCH_TEST_SDK: ${{ github.workspace }}/local/ps3recomp-lifter-5244db9
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/self-hosted-linux
        with:
          rust: 'true'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Pinned ps3recomp checkouts
        run: python tools/fetch_ps3recomp.py --role runtime --role lifter-spu
      - name: SDK tool dependencies
        run: python -m pip install -r local/ps3recomp-runtime/requirements.txt
      - name: Pinned Rust toolchain for native build fixtures
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Fetch locked frontend dependencies for offline build fixtures
        run: cargo fetch --manifest-path crates/mag-render/Cargo.toml --locked
      - name: Project tests
        run: python -m unittest discover -s tests -t . -v
      - name: Tool self-tests
        run: python -m unittest discover -s tools -p 'test_*.py' -t . -v

  python-macos:
    # Apple Silicon is the supported target; several tests build macOS fixtures with clang.
    # Not a required check. Runs on pushes to main only, since hosted macOS capacity is scarce.
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    env:
      MAG_TEST_SDK: ${{ github.workspace }}/local/ps3recomp-runtime
      SPU_BATCH_TEST_SDK: ${{ github.workspace }}/local/ps3recomp-lifter-5244db9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Pinned ps3recomp checkouts
        run: python tools/fetch_ps3recomp.py --role runtime --role lifter-spu
      - name: SDK tool dependencies
        run: python -m pip install -r local/ps3recomp-runtime/requirements.txt
      - name: Pinned Rust toolchain for native build fixtures
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Fetch locked frontend dependencies for offline build fixtures
        run: cargo fetch --manifest-path crates/mag-render/Cargo.toml --locked
      - name: Project tests
        run: python -m unittest discover -s tests -t . -v
      - name: Tool self-tests
        run: python -m unittest discover -s tools -p 'test_*.py' -t . -v

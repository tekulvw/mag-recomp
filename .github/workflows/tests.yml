name: Tests
on:
  push:
    branches: [main, codex/render-frontend-integration]
  pull_request:
permissions:
  contents: read
# Cancel a pull request's superseded runs; every push keeps its own group.
concurrency:
  group: tests-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  # Which jobs this pull request's changes reach (tools/ci_changes.py holds the filter map; pushes,
  # release PRs and unreadable diffs run everything). A skipped job counts as passed for a required
  # check, so `python` stays required and skips itself only for documentation-only changes. On a
  # hosted runner: it is seconds of git diff and should not wait for the self-hosted queue.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.diff.outputs.python }}
      rust_input: ${{ steps.diff.outputs.rust_input }}
      windows_native: ${{ steps.diff.outputs.windows_native }}
      macos_settings: ${{ steps.diff.outputs.macos_settings }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull request merge commit and its base parent.
          fetch-depth: 2
          persist-credentials: false
      - id: diff
        run: python3 tools/ci_changes.py --base HEAD^1 --head HEAD
  rust:
    needs: changes
    if: needs.changes.outputs.rust_input == 'true'
    name: Rust input (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Hosted macOS capacity is scarce: pull requests run Linux and Windows,
        # pushes to main add macOS.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["mag-recomp","windows-latest"]' || '["macos-latest","mag-recomp","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: crates/mag-input
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/self-hosted-linux
        with:
          rust: 'true'
      - uses: ./.github/actions/sccache
        with:
          prefix: mag-recomp/tests-rust
          access-key-id: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
      - name: Pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --offline --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --offline
      - name: Compiler cache statistics and upload
        if: always() && env.SCCACHE_BIN != ''
        uses: ./.github/actions/sccache
        with:
          upload: 'true'
          access-key-id: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
  native-edgegeom:
    # The opt-in native Edge geometry job's synthetic tests on the other two hosts; the python
    # jobs run them on Linux and macOS with the rest of the suite.
    needs: changes
    if: needs.changes.outputs.windows_native == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: ./.github/actions/windows-llvm
      - name: Pinned ps3recomp runtime
        run: python tools/fetch_ps3recomp.py --role runtime
      - name: Native Edge geometry tests
        env:
          MAG_TEST_SDK: ${{ github.workspace }}/local/ps3recomp-runtime
        run: python -m unittest tests.test_native_edgegeom tests.test_payload_override_hooks tests.test_extension_registry -v
  settings-window-windows:
    # The Win32 settings window, driven with synthetic messages; the python jobs run its SDL2 panel
    # and form tests on Linux and macOS.
    needs: changes
    if: needs.changes.outputs.windows_native == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: ./.github/actions/windows-llvm
      - name: Pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Settings window tests
        run: python -m unittest tests.test_player_settings_window -v
  settings-macos:
    # The macOS settings panel's fixtures (AppKit panel, controls pane, Debug page, reports rows,
    # runtime glue) on pull requests that touch them. python-macos runs the whole suite only on
    # pushes to main, and a missing link input once reached main that way (#261). Not a required check.
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.macos_settings == 'true'
    runs-on: macos-latest
    env:
      MAG_TEST_SDK: ${{ github.workspace }}/local/ps3recomp-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Pinned ps3recomp runtime
        run: python tools/fetch_ps3recomp.py --role runtime
      - name: Pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: macOS settings tests
        run: python -m unittest tests.test_player_settings tests.test_player_controls_settings tests.test_player_settings_window tests.test_player_reports -v
  python:
    # Required check. Runs on the self-hosted Linux runners so pull requests are gated without
    # hosted minutes; tests that need macOS skip themselves here and run in python-macos below.
    # Skipped (reported as passed) only when `changes` says a pull request is documentation-only.
    # If `changes` fails, its outputs are empty and this runs rather than passing unchecked.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.python != 'false' }}
    runs-on: mag-recomp
    env:
      MAG_TEST_SDK: ${{ github.workspace }}/local/ps3recomp-runtime
      SPU_BATCH_TEST_SDK: ${{ github.workspace }}/local/ps3recomp-lifter-5244db9
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/self-hosted-linux
        with:
          rust: 'true'
          # Opus for the voice service's codec tests (tests/test_voice.py).
          packages: libopus-dev
      - uses: ./.github/actions/sccache
        with:
          prefix: mag-recomp/tests-python
          access-key-id: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Pinned ps3recomp checkouts
        run: python tools/fetch_ps3recomp.py --role runtime --role lifter-spu
      - name: SDK tool dependencies
        run: python -m pip install -r local/ps3recomp-runtime/requirements.txt
      - name: Pinned Rust toolchain for native build fixtures
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Fetch locked frontend dependencies for offline build fixtures
        run: cargo fetch --manifest-path crates/mag-render/Cargo.toml --locked
      - name: Project tests
        run: python -m unittest discover -s tests -t . -v
      - name: Tool self-tests
        run: python -m unittest discover -s tools -p 'test_*.py' -t . -v
      - name: Compiler cache statistics and upload
        if: always() && env.SCCACHE_BIN != ''
        uses: ./.github/actions/sccache
        with:
          upload: 'true'
          access-key-id: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}

  python-macos:
    # Apple Silicon is the supported target; several tests build macOS fixtures with clang.
    # Not a required check. Runs on pushes to main only, since hosted macOS capacity is scarce.
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    env:
      MAG_TEST_SDK: ${{ github.workspace }}/local/ps3recomp-runtime
      SPU_BATCH_TEST_SDK: ${{ github.workspace }}/local/ps3recomp-lifter-5244db9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Pinned ps3recomp checkouts
        run: python tools/fetch_ps3recomp.py --role runtime --role lifter-spu
      - name: SDK tool dependencies
        run: python -m pip install -r local/ps3recomp-runtime/requirements.txt
      - name: Pinned Rust toolchain for native build fixtures
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Fetch locked frontend dependencies for offline build fixtures
        run: cargo fetch --manifest-path crates/mag-render/Cargo.toml --locked
      - name: Project tests
        run: python -m unittest discover -s tests -t . -v
      - name: Tool self-tests
        run: python -m unittest discover -s tools -p 'test_*.py' -t . -v

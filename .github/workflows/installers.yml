name: Installers

# Builds the macOS (Apple Silicon) and Windows (x86_64) installers from this
# repository's source. They contain tooling and source only, never anything
# built from game files. Pull requests and main produce workflow artifacts;
# release-please.yml calls this workflow with the new tag to attach them to
# the release (installer/docs/release-packaging.md).
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and attach installers to
        type: string
        required: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  kit:
    name: Source kit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Check out the pinned ps3recomp revisions
        run: python tools/fetch_ps3recomp.py
      - name: Prepare one kit per installer host
        run: |
          for host in windows-x86_64 macos-arm64; do
            cp -R installer "$RUNNER_TEMP/installer-$host"
            rm "$RUNNER_TEMP/installer-$host/release/player-build.json"
            python "$RUNNER_TEMP/installer-$host/scripts/prepare_player_kit.py" \
              --root "$RUNNER_TEMP/installer-$host" --source . --host "$host"
            mkdir -p "kit-$host"
            cp "$RUNNER_TEMP/installer-$host/release/native-kit.tar.gz" "$RUNNER_TEMP/installer-$host/release/player-build.json" "kit-$host/"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kit-windows-x86_64
          path: kit-windows-x86_64/*
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kit-macos-arm64
          path: kit-macos-arm64/*
          if-no-files-found: error
          retention-days: 3

  windows:
    name: Windows installer
    needs: kit
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Unit tests
        working-directory: installer
        run: python -m unittest discover -s tests
      - name: Check out the pinned runtime and PPU lifter
        run: python tools/fetch_ps3recomp.py --role runtime --role lifter-ppu
      - name: Installer toolchain route (Build Tools, managed tools, runtime build, supervisor)
        run: python .github/scripts/windows_toolchain_smoke.py --runtime-sdk local/ps3recomp-runtime --work "C:/mag-ci"
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Compile MAG's sources and the pinned runtime with clang-cl (no game data)
        run: |
          python -m pip install --disable-pip-version-check ninja==1.13.0
          python .github/scripts/windows_native_check.py --runtime-sdk local/ps3recomp-runtime \
            --ppu-sdk local/ps3recomp-lifter-dfa7073 --work "$RUNNER_TEMP/native-check"
      - name: Replace the source placeholder with the generated kit manifest
        run: rm installer/release/player-build.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kit-windows-x86_64
          path: installer/release
      - name: Install the hash-locked packager
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r installer/requirements-release.txt
      - name: Build and smoke-test the frozen installer
        env:
          EXPECTED_TARGET: windows-x86_64
        run: |
          export INSTALLER_SOURCE_REVISION="$(git rev-parse HEAD)"
          if [ -n "$RELEASE_TAG" ]; then
            python installer/scripts/release_installer.py build --output "$GITHUB_WORKSPACE/installer-out" --version "$RELEASE_TAG"
          else
            python installer/scripts/release_installer.py build --output "$GITHUB_WORKSPACE/installer-out" --version "preview-$GITHUB_RUN_NUMBER" --preview
          fi
      - name: The frozen installer finds its kit and reports Build MAG ready
        run: |
          mkdir "$RUNNER_TEMP/unpacked" && cd "$RUNNER_TEMP/unpacked"
          unzip -q "$GITHUB_WORKSPACE"/installer-out/*.zip
          ./*/mag-installer.exe status > status.json
          python -c "import json,sys; s=json.load(open('status.json')); print(json.dumps(s['player_build'])); sys.exit(0 if s['player_build'].get('ready') else 1)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mag-installer-windows-x86_64
          path: installer-out/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  macos:
    name: macOS installer
    needs: kit
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Unit tests
        working-directory: installer
        run: python -m unittest discover -s tests
      - name: Replace the source placeholder with the generated kit manifest
        run: rm installer/release/player-build.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kit-macos-arm64
          path: installer/release
      - name: Install the hash-locked packager
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r installer/requirements-release.txt
      - name: Build and smoke-test the frozen installer
        env:
          EXPECTED_TARGET: macos-arm64
        run: |
          export INSTALLER_SOURCE_REVISION="$(git rev-parse HEAD)"
          if [ -n "$RELEASE_TAG" ]; then
            python installer/scripts/release_installer.py build --output "$GITHUB_WORKSPACE/installer-out" --version "$RELEASE_TAG"
          else
            python installer/scripts/release_installer.py build --output "$GITHUB_WORKSPACE/installer-out" --version "preview-$GITHUB_RUN_NUMBER" --preview
          fi
      - name: The frozen installer finds its kit and reports Build MAG ready
        run: |
          mkdir "$RUNNER_TEMP/unpacked" && cd "$RUNNER_TEMP/unpacked"
          unzip -q "$GITHUB_WORKSPACE"/installer-out/*.zip
          ./*/"MAG Installer.app/Contents/MacOS/mag-installer" status > status.json
          python -c "import json,sys; s=json.load(open('status.json')); print(json.dumps(s['player_build'])); sys.exit(0 if s['player_build'].get('ready') else 1)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mag-installer-macos-arm64
          path: installer-out/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    name: Attach installers to the release
    if: inputs.tag != ''
    needs: [windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mag-installer-*
          path: release-assets
          merge-multiple: true
      - name: Verify the exact set and attach it without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          SOURCE_REVISION="$(git rev-parse HEAD)"
          python installer/scripts/release_installer.py verify-set --directory release-assets --version "$RELEASE_TAG" --source-revision "$SOURCE_REVISION"
          python installer/scripts/publish_release.py --directory release-assets --tag "$RELEASE_TAG" --source-revision "$SOURCE_REVISION"

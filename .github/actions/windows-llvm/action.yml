name: Pinned LLVM for hosted Windows
description: >-
  Install a pinned, checksum-verified LLVM release and put it first on PATH, so
  clang, clang++ and clang-cl are new enough for the image's MSVC STL. The
  windows-latest image moved to MSVC STL 14.52 (Visual Studio 18), which
  rejects Clang older than 22 (error STL1000), while its preinstalled LLVM in
  C:\Program Files\LLVM is older. Skipped on non-Windows runners.
runs:
  using: composite
  steps:
    - name: Install pinned LLVM 22.1.8
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # Official llvm/llvm-project release asset; the SHA-256 matches GitHub's
        # asset digest and the Chocolatey llvm 22.1.8 package's checksum64.
        $version = '22.1.8'
        $expected = '16e5709785fef73c854646241c4a92c5cd574318d1b33c63330dd7721903e55c'
        $installer = Join-Path $env:RUNNER_TEMP "LLVM-$version-win64.exe"
        $prefix = Join-Path $env:RUNNER_TEMP "llvm-$version"
        Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/LLVM-$version-win64.exe" -OutFile $installer
        if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw "LLVM $version installer hash mismatch" }
        $process = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$prefix" -Wait -PassThru
        if ($process.ExitCode -ne 0) { throw "LLVM $version installer exited with $($process.ExitCode)" }
        $bin = Join-Path $prefix 'bin'
        if (!(Test-Path (Join-Path $bin 'clang-cl.exe'))) { throw "LLVM $version installed no clang-cl.exe" }
        $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        Remove-Item $installer
    - name: Show the selected Windows compilers
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        (Get-Command clang-cl).Source
        clang-cl --version
        (Get-Command clang++).Source
        # For comparison: the clang-cl a Visual Studio instance bundles, which is
        # what the player installer builds with (installer/mag_installer/managed_tools.py).
        $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
        $vs = & $vswhere -latest -products * -property installationPath
        $bundled = Join-Path "$vs" 'VC/Tools/Llvm/x64/bin/clang-cl.exe'
        if ($vs -and (Test-Path $bundled)) { & $bundled --version } else { 'No Visual Studio-bundled clang-cl found' }
        $msvc = Join-Path "$vs" 'VC/Auxiliary/Build/Microsoft.VCToolsVersion.default.txt'
        if ($vs -and (Test-Path $msvc)) { "Default MSVC toolset: $((Get-Content $msvc).Trim())" }

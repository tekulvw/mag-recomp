[package]
name = "mag-input"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Portable input state, routing, and recognition"

[lib]
crate-type = ["rlib", "staticlib"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"

[profile.release]
panic = "unwind"

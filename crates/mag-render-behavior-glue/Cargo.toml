[package]
name = "mag-render-behavior-glue"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Glue between the clean-room behaviour crate, the public adapter core and the packet ABI"

[lib]
name = "mag_render_behavior_glue"

[dependencies]
mag-render-abi = { path = "../mag-render-abi" }
mag-render-adapter-core = { path = "../mag-render-adapter-core" }
mag-render-behavior = { path = "../mag-render-behavior" }
mag-render-programs = { path = "../mag-render-programs" }

[dev-dependencies]
# The real packet validator, for round-trip tests of the ABI builder.
mag-render-native = { path = "../mag-render-native" }

[lints.rust]
# The library has no unsafe code; only the validator round-trip test calls the unsafe entry point.
unsafe_code = "deny"
